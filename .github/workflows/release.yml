name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for Sigstore OIDC keyless signing

jobs:
  build-and-sign:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ix-zig.exe
            archive: ix-windows-x86_64.zip
          - os: ubuntu-latest
            artifact: ix-zig
            archive: ix-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: ix-zig
            archive: ix-macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Download vendored dependencies
        shell: bash
        run: |
          # StringZilla
          mkdir -p .refs/stringzilla/include
          curl -sL https://raw.githubusercontent.com/ashvardanian/StringZilla/v4.6.0/include/stringzilla/stringzilla.h -o .refs/stringzilla/include/stringzilla.h
          curl -sL https://raw.githubusercontent.com/ashvardanian/StringZilla/v4.6.0/include/stringzilla/stringzilla.hpp -o .refs/stringzilla/include/stringzilla.hpp || true
          # PCRE2 10.44
          mkdir -p .refs/pcre2/src
          for f in pcre2_auto_possess pcre2_chartables pcre2_chkdint pcre2_compile pcre2_config pcre2_context pcre2_convert pcre2_dfa_match pcre2_error pcre2_extuni pcre2_find_bracket pcre2_jit_compile pcre2_maketables pcre2_match pcre2_match_data pcre2_newline pcre2_ord2utf pcre2_pattern_info pcre2_script_run pcre2_serialize pcre2_string_utils pcre2_study pcre2_substitute pcre2_substring pcre2_tables pcre2_ucd pcre2_valid_utf pcre2_xclass sljit sljitConfigCCallback sljitConfigInternal sljitLir sljitNativeARM_32 sljitNativeARM_64 sljitNativeX86_32 sljitNativeX86_64; do
            curl -sL "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/src/${f}.c" -o ".refs/pcre2/src/${f}.c" 2>/dev/null
            curl -sL "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/src/${f}.h" -o ".refs/pcre2/src/${f}.h" 2>/dev/null
          done
          curl -sL "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/src/pcre2.h" -o ".refs/pcre2/src/pcre2.h"
          curl -sL "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/src/pcre2_internal.h" -o ".refs/pcre2/src/pcre2_internal.h"
          curl -sL "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/src/config.h" -o ".refs/pcre2/src/config.h"
          echo "Downloaded PCRE2 + StringZilla dependencies"

      - name: Download tree-sitter dependencies
        shell: bash
        run: |
          # Tree-sitter runtime
          mkdir -p .refs/tree-sitter/lib/unicode .refs/tree-sitter/lib/portable
          mkdir -p .refs/tree-sitter/include/tree_sitter
          TS_VER=v0.25.3
          curl -sL "https://raw.githubusercontent.com/tree-sitter/tree-sitter/${TS_VER}/lib/include/tree_sitter/api.h" -o .refs/tree-sitter/include/tree_sitter/api.h
          for f in alloc bits clock error_costs get_changed_ranges language lexer length node parser query reduce_action reusable_node stack subtree tree tree_cursor unicode ts_assert host wasm_store wasm_host point; do
            curl -sL "https://raw.githubusercontent.com/tree-sitter/tree-sitter/${TS_VER}/lib/src/${f}.c" -o ".refs/tree-sitter/lib/${f}.c" 2>/dev/null
            curl -sL "https://raw.githubusercontent.com/tree-sitter/tree-sitter/${TS_VER}/lib/src/${f}.h" -o ".refs/tree-sitter/lib/${f}.h" 2>/dev/null
          done
          # Minimal unicode.h (no ICU dependency)
          printf '#ifndef TREE_SITTER_UNICODE_H_\n#define TREE_SITTER_UNICODE_H_\n#include <stdint.h>\n#define TS_DECODE_ERROR ((uint32_t)-1)\nstatic inline uint32_t ts_decode_utf8(const uint8_t *i, uint32_t l, uint32_t *cp) {\n  if(!l){*cp=0;return 0;}\n  uint8_t f=*i;\n  if(f<0x80){*cp=f;return 1;}\n  if((f&0xE0)==0xC0&&l>=2){*cp=((f&0x1F)<<6)|(i[1]&0x3F);return 2;}\n  if((f&0xF0)==0xE0&&l>=3){*cp=((f&0x0F)<<12)|((i[1]&0x3F)<<6)|(i[2]&0x3F);return 3;}\n  if((f&0xF8)==0xF0&&l>=4){*cp=((f&0x07)<<18)|((i[1]&0x3F)<<12)|((i[2]&0x3F)<<6)|(i[3]&0x3F);return 4;}\n  *cp=f;return 1;\n}\nstatic inline uint32_t ts_decode_utf16_le(const uint8_t *i, uint32_t l, uint32_t *cp){if(l<2){*cp=TS_DECODE_ERROR;return 0;}*cp=i[0]|(i[1]<<8);return 2;}\nstatic inline uint32_t ts_decode_utf16_be(const uint8_t *i, uint32_t l, uint32_t *cp){if(l<2){*cp=TS_DECODE_ERROR;return 0;}*cp=(i[0]<<8)|i[1];return 2;}\n#endif\n' > .refs/tree-sitter/lib/unicode.h
          printf '#ifndef PORTABLE_ENDIAN_H\n#define PORTABLE_ENDIAN_H\n#include <stdint.h>\n#endif\n' > .refs/tree-sitter/lib/portable/endian.h
          # WASM stubs
          printf '#include <stdint.h>\n#include <stdbool.h>\n#include "tree_sitter/api.h"\nbool ts_language_is_wasm(const TSLanguage*s){return false;}\nvoid ts_wasm_language_retain(const TSLanguage*s){}\nvoid ts_wasm_language_release(const TSLanguage*s){}\nvoid ts_wasm_store_delete(TSWasmStore*s){}\nbool ts_wasm_store_start(TSWasmStore*s,TSLexer*l,const TSLanguage*g){return false;}\nvoid ts_wasm_store_reset(TSWasmStore*s){}\nbool ts_wasm_store_has_error(const TSWasmStore*s){return false;}\nbool ts_wasm_store_call_lex_main(TSWasmStore*s,uint16_t st){return false;}\nbool ts_wasm_store_call_lex_keyword(TSWasmStore*s,uint16_t st){return false;}\nuint32_t ts_wasm_store_call_scanner_create(TSWasmStore*s){return 0;}\nvoid ts_wasm_store_call_scanner_destroy(TSWasmStore*s,uint32_t a){}\nbool ts_wasm_store_call_scanner_scan(TSWasmStore*s,uint32_t a,uint32_t v){return false;}\nuint32_t ts_wasm_store_call_scanner_serialize(TSWasmStore*s,uint32_t a,char*b){return 0;}\nvoid ts_wasm_store_call_scanner_deserialize(TSWasmStore*s,uint32_t sc,const char*b,unsigned l){}\n' > .refs/tree-sitter/lib/wasm_stubs.c
          # Zig grammar
          mkdir -p .refs/tree-sitter-zig/src/tree_sitter
          curl -sL "https://raw.githubusercontent.com/maxxnino/tree-sitter-zig/main/src/parser.c" -o .refs/tree-sitter-zig/src/parser.c
          curl -sL "https://raw.githubusercontent.com/tree-sitter-grammars/tree-sitter-zig/v1.1.2/src/tree_sitter/parser.h" -o .refs/tree-sitter-zig/src/tree_sitter/parser.h
          echo "Downloaded tree-sitter + Zig grammar"

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      # P30: Sigstore keyless signing — trusted, cross-platform, no paid cert needed.
      # Uses GitHub OIDC identity to obtain a short-lived Fulcio CA certificate.
      # Verifiable via: cosign verify-blob --certificate cert.pem --signature sig.bin binary
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary (Sigstore keyless)
        env:
          IX_SIGN_METHOD: sigstore
        run: python3 tools/scripts/sign_binary.py zig-out/bin/${{ matrix.artifact }}
        if: matrix.os != 'windows-latest'

      - name: Sign binary (Windows Sigstore)
        shell: pwsh
        env:
          IX_SIGN_METHOD: sigstore
        run: python tools/scripts/sign_binary.py zig-out/bin/${{ matrix.artifact }}
        if: matrix.os == 'windows-latest'

      # Also sign Windows binary with Authenticode if a cert is available.
      - name: Sign binary (Windows Authenticode, optional)
        shell: pwsh
        env:
          IX_SIGN_CERT: ${{ secrets.IX_SIGN_CERT }}
          IX_SIGN_PASSWORD: ${{ secrets.IX_SIGN_PASSWORD }}
        run: |
          if ($env:IX_SIGN_CERT) {
            [System.IO.File]::WriteAllBytes("cert.pfx", [System.Convert]::FromBase64String($env:IX_SIGN_CERT))
            $env:IX_SIGN_CERT = "cert.pfx"
            python tools/scripts/sign_binary.py zig-out/bin/${{ matrix.artifact }}
          }
        if: matrix.os == 'windows-latest'

      - name: Compute SHA256
        shell: bash
        run: |
          sha256sum zig-out/bin/${{ matrix.artifact }} | tee checksums-${{ matrix.os }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ix-${{ matrix.os }}
          path: |
            zig-out/bin/
            checksums-*.txt

  release:
    needs: build-and-sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*/zig-out/bin/*
            artifacts/*/checksums-*.txt
